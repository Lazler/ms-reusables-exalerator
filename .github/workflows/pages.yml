name: Add-in auf GitHub Pages veröffentlichen

# Testet und kopiert den Ordner addin/ in den Branch gh-pages.
# GitHub Pages liefert diesen Branch unter https://lazler.github.io/ms-reusables-exalerator/ aus.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: addin/ nach gh-pages veröffentlichen
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          cp -r addin "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Add-in veröffentlicht aus $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
