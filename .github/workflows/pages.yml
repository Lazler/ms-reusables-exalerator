name: Deploy add-in to GitHub Pages

# Runs the tests and copies addin/ into the gh-pages branch.
# GitHub Pages serves that branch at https://lazler.github.io/ms-reusables-exalerator/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Publish addin/ to gh-pages
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          cp -r addin "$RUNNER_TEMP/site"
          # Stamp the build: version label + cache busting for css/js
          sed -i "s/__BUILD__/$SHA/g" "$RUNNER_TEMP/site/taskpane.html"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy add-in from $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
